name: Verify catalog rating badges

on:
  push:
    branches: [feat/catalog-rating-badges]
    paths:
      - '.github/workflows/catalog-rating-patch.yml'
      - '.github/catalog_rating_patch/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-rating-badges-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/catalog-rating-badges
          fetch-depth: 0

      - name: Apply catalog rating implementation
        run: python3 .github/catalog_rating_patch/apply.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and diff check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dart_files < <(git status --porcelain | sed -E 's/^.. //' | grep -E '\.dart$' || true)
          if (( ${#dart_files[@]} )); then dart format "${dart_files[@]}"; fi
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Catalog rating regression tests
        run: >-
          flutter test
          test/shared/widgets/catalog_rating_badge_test.dart
          test/shared/widgets/multimedia_card_test.dart
          test/core/extensions/providers/animewitcher_ratings_fields_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full Flutter test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generated < <(git status --porcelain | sed -E 's/^.. //' | grep -E '\.g\.dart$' || true)
          if (( ${#generated[@]} )); then git checkout HEAD -- "${generated[@]}"; fi
          rm -rf .github/catalog_rating_patch .github/workflows/catalog-rating-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'Fares669'
          git config user.email '108722956+Fares669@users.noreply.github.com'
          git commit -m 'feat: show catalog rating sources on anime cards'
          git push origin HEAD:feat/catalog-rating-badges
