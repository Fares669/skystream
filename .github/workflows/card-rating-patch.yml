name: Verify catalog card ratings

on:
  push:
    branches: [ui/details-compact-ratings]
    paths:
      - '.github/card_rating_patch.py'
      - '.github/workflows/card-rating-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-catalog-card-ratings
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/details-compact-ratings
          fetch-depth: 0

      - name: Apply catalog rating implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/card_rating_patch.py
          python3 - <<'PY'
          from pathlib import Path
          card = Path('lib/shared/widgets/multimedia_card.dart')
          text = card.read_text(encoding='utf-8')
          text = text.replace(
              "final sourceSize = ((subtitleTextStyle.fontSize ?? 11) - 1).clamp(8.0, 12.0);",
              "final sourceSize = ((subtitleTextStyle.fontSize ?? 11) - 1).clamp(8.0, 12.0).toDouble();",
          )
          card.write_text(text, encoding='utf-8')

          test = Path('test/core/utils/catalog_rating_test.dart')
          text = test.read_text(encoding='utf-8').replace("'awScore': '-1'", "'awScore': 'not-a-score'")
          test.write_text(text, encoding='utf-8')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and validate diff
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/core/extensions/providers/animewitcher_native_provider.dart \
            lib/core/utils/catalog_rating.dart \
            lib/shared/widgets/multimedia_card.dart \
            test/core/utils/catalog_rating_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Catalog rating regression test
        run: flutter test test/core/utils/catalog_rating_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full Flutter test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f test/core/utils/catalog_rating_test.dart
          git rm .github/card_rating_patch.py .github/workflows/card-rating-patch.yml
          git add \
            lib/core/extensions/providers/animewitcher_native_provider.dart \
            lib/core/utils/catalog_rating.dart \
            lib/shared/widgets/multimedia_card.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cards): prefer MAL then IMDb ratings'
          git push origin HEAD:ui/details-compact-ratings
