name: Verify true parallel chunk progress

on:
  push:
    branches: [fix/true-parallel-chunk-progress]
    paths:
      - '.github/chunk_progress_patch/**'
      - '.github/workflows/true-chunk-progress-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: true-parallel-chunk-progress
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/true-parallel-chunk-progress
          fetch-depth: 0

      - name: Apply implementation patch
        run: python3 .github/chunk_progress_patch/apply.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Generate
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and diff check
        run: |
          set -euo pipefail
          dart format \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart \
            lib/features/library/presentation/widgets/segmented_download_progress.dart \
            lib/features/library/presentation/widgets/downloads_tab.dart \
            test/features/library/presentation/widgets/segmented_download_progress_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Chunk progress widget tests
        run: >-
          flutter test
          test/features/library/presentation/widgets/segmented_download_progress_test.dart
          test/core/services/download_parallel_test.dart
          test/core/services/download_concurrency_test.dart
          test/core/services/download_service_queue_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full Flutter tests
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Build iOS without signing
        run: flutter build ios --no-codesign --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Finalize verified implementation
        run: |
          set -euo pipefail
          git checkout -- lib/features/details/presentation/details_controller.g.dart 2>/dev/null || true
          git rm -r .github/chunk_progress_patch .github/workflows/true-chunk-progress-verify.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: show real parallel chunk progress'
          git push origin HEAD:fix/true-parallel-chunk-progress
