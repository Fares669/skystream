name: Verify adaptive parallel downloads

on:
  push:
    branches: [feat/adaptive-parallel-downloads]
    paths:
      - '.github/workflows/parallel-download-patch.yml'
      - '.github/parallel_patch/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-parallel-download-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/adaptive-parallel-downloads
          fetch-depth: 0

      - name: Apply staged implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/parallel_patch/part*.b64 | base64 --decode > /tmp/apply_parallel_downloads.py
          python3 -m py_compile /tmp/apply_parallel_downloads.py
          python3 /tmp/apply_parallel_downloads.py
          python3 .github/parallel_patch/augment.py
          python3 .github/parallel_patch/fix_types.py
          python3 .github/parallel_patch/fix_queue_tests_v2.py
          python3 .github/parallel_patch/fix_memory_storage_parallel.py

      - name: Update legacy HoldingQueue expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/core/services/download_concurrency_test.dart')
          text = path.read_text(encoding='utf-8')
          start = text.find("  group('holding queue tuple', () {")
          end = text.find("  group('applyDownloadQueueSettings', () {", start)
          if start < 0 or end < 0:
              raise RuntimeError('holding queue test section not found')
          text = text[:start] + """  group('parallel-compatible queue configuration', () {
            test('disables plugin holding queue so chunks cannot consume episode slots', () {
              final config = downloadHoldingQueueGlobalConfig(2);
              expect(config, hasLength(1));
              expect(config.single.$1, Config.holdingQueue);
              expect(config.single.$2, false);
            });
          });

          """ + text[end:]
          text = text.replace(
              """        expect(configured, <(String, dynamic)>[
                    (Config.holdingQueue, (5, null, null)),
                  ]);""",
              """        expect(configured, <(String, dynamic)>[
                    (Config.holdingQueue, false),
                  ]);""",
              1,
          )
          text = text.replace(
              "expect(configured.single.$2, (1, null, null));",
              "expect(configured.single.$2, false);",
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('test/core/services/download_service_queue_test.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              """    expect(configured, <(String, dynamic)>[
                  (Config.holdingQueue, (3, null, null)),
                ]);""",
              """    expect(configured, <(String, dynamic)>[
                  (Config.holdingQueue, false),
                ]);""",
              1,
          )
          text = text.replace(
              "expect(configured!.single.$2, downloadHoldingQueueValue(1));",
              "expect(configured!.single.$2, false);",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Generate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and diff check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dart_files < <(git status --porcelain | sed -E 's/^.. //' | grep -E '\.dart$' || true)
          if (( ${#dart_files[@]} )); then dart format "${dart_files[@]}"; fi
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Download settings integration tests
        shell: bash
        run: |
          flutter test test/features/settings/presentation/download_concurrency_settings_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Focused parallel and queue tests
        shell: bash
        run: |
          flutter test \
            test/core/services/download_parallel_test.dart \
            test/core/services/download_concurrency_test.dart \
            test/core/services/download_service_queue_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full Flutter test suite
        shell: bash
        run: |
          set +e
          flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key > /tmp/full-flutter-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== FULL SUITE FAILURE EXCERPT ==="
            grep -n -E -B 20 -A 70 "TestFailure|Expected:|Actual:|Exception|EXCEPTION|Some tests failed|══╡|Failing tests:" /tmp/full-flutter-test.log || true
            echo "=== FULL SUITE TAIL ==="
            tail -n 260 /tmp/full-flutter-test.log
          else
            tail -n 30 /tmp/full-flutter-test.log
          fi
          exit $status

      - name: Upload full Flutter test log
        uses: actions/upload-artifact@v4
        with:
          name: full-flutter-test-log
          path: /tmp/full-flutter-test.log
          if-no-files-found: error

      - name: Promote verified feature
        shell: bash
        run: |
          set -euo pipefail
          # build_runner currently rewrites this unrelated generated file on CI;
          # keep the feature PR scoped to download changes only.
          git restore --source=HEAD -- lib/features/details/presentation/details_controller.g.dart

          # Staging machinery must never appear in the final PR tree.
          rm -rf .github/parallel_patch
          rm -f .github/workflows/parallel-download-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No verified feature changes to commit" >&2
            exit 1
          fi

          git commit -m "feat: add adaptive parallel episode downloads"
          git push origin HEAD:feat/adaptive-parallel-downloads

      - name: Show final state
        if: always()
        shell: bash
        run: |
          git status --short
          git log -1 --oneline
